[package]
name = "aws-kms-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.0"
aws-config = { version = "=1.6.3", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = "1.77.0"
aws-sdk-s3 = "1.96.0"
base64 = "0.22.1"
dotenvy = "0.15.7"
ed25519-dalek = "3.0.0"
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
