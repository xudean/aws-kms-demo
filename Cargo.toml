[package]
name = "aws-kms-demo"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = []
# Links the enclave binary with aws-nitro-enclaves-sdk-c. This feature is
# intended for the Linux image used to build the EIF, not for local macOS runs.
nitro-enclave = []

[dependencies]
aes-gcm = "0.11.0"
aws-config = { version = "=1.6.3", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-credential-types = "=1.2.10"
aws-sdk-kms = "1.77.0"
aws-sdk-s3 = "1.96.0"
base64 = "0.22.1"
dotenvy = "0.15.7"
ed25519-dalek = "3.0.0"
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
zeroize = "1.9.0"

[build-dependencies]
cc = "1.2.16"
